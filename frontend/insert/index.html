<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Appointment Manager</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link href="index.css" rel="stylesheet" />
    <script src="index.js" defer></script>
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand text-white fw-bold" href="#"> Appointments </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link btn-search" href="/frontend/search/index.html">
                Search
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <form class="container mt-5" style="max-width: 700px">
      <h2 class="mb-4">Insert Appointment</h2>

      <div class="mb-3">
        <label for="title" class="form-label"> Title </label>

        <input
          type="text"
          class="form-control"
          id="title"
          name="title"
          placeholder="Enter the appointment title"
          required
        />
      </div>

      <div class="mb-3">
        <label for="description" class="form-label"> Description </label>

        <textarea
          class="form-control"
          id="description"
          name="description"
          rows="4"
          placeholder="Enter the appointment description"
        ></textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="start_date" class="form-label"> Start Date </label>

          <input
            type="date"
            class="form-control"
            id="start_date"
            name="start_date"
            required
          />
        </div>

        <div class="col-md-6 mb-3">
          <label for="end_date" class="form-label"> End Date </label>

          <input
            type="date"
            class="form-control"
            id="end_date"
            name="end_date"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Insert Appointment</button>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
