<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Appointment Manager</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link href="index.css" rel="stylesheet" />
    <script src="index.js" defer></script>
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand text-white fw-bold" href="../index.html">
          Appointments
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link btn-insert" href="../index.html"> Insert </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <h2 class="mb-4">Appointments</h2>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-secondary">
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Title</th>
              <th scope="col">Description</th>
              <th scope="col">Start Date</th>
              <th scope="col">End Date</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>

          <tbody id="appointments-table"></tbody>
        </table>
      </div>
    </div>

    <!-- Modal -->
    <div
      class="modal fade"
      id="appointmentModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit appointment</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="appointmentId" />

            <div class="mb-3">
              <label class="form-label"> Title </label>

              <input type="text" id="appointmentTitle" class="form-control" />
            </div>

            <div class="mb-3">
              <label class="form-label"> Description </label>

              <textarea
                id="appointmentDescription"
                class="form-control"
              ></textarea>

              <div class="mb-3">
                <label class="form-label"> Date </label>

                <input type="Date" id="appointmentDate" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label"> End Date </label>

                <input
                  type="Date"
                  id="appointmentEndDate"
                  class="form-control"
                />
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button type="button" class="btn btn-primary" id="saveAppointment">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
